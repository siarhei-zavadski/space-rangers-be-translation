name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject committed game binaries
        run: |
          if git ls-files | grep -E '\.(dat|gi|pkg|qmm|aft)$'; then
            echo "Proprietary/generated game binaries must not be committed."
            exit 1
          fi

      - name: Compile project scripts
        run: python -m py_compile ./*.py

      - name: Validate corpus
        run: python validate_corpus.py

      - name: Check translated rows
        run: python test_qa_translation.py

      - name: Validate GitHub workflows
        uses: docker://rhysd/actionlint:1.7.12

name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reject committed game binaries
        run: |
          if git ls-files | grep -E '\.(dat|gi|pkg|qmm|aft)$'; then
            echo "Proprietary/generated game binaries must not be committed."
            exit 1
          fi

      - name: Compile project scripts
        run: python -m py_compile ./*.py

      - name: Validate corpus
        run: python validate_corpus.py

      - name: Check translated rows
        run: python test_qa_translation.py

      # Binary from GitHub Releases — docker://rhysd/actionlint hits Docker Hub rate limits.
      - name: Validate GitHub workflows
        shell: bash
        run: |
          set -euo pipefail
          ver=1.7.12
          archive="actionlint_${ver}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/${archive}"
          curl -fsSL --proto '=https' --tlsv1.2 \
            -o checksums.txt \
            "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_checksums.txt"
          grep -F "$archive" checksums.txt | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -color

name: Build mod

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Maintainer's Linux machine. The licensed game stays on that disk;
    # GitHub-hosted runners must not receive it. Fork pull requests must
    # not select this runner (see SECURITY.md).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, linux, space-rangers-hd]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-local.txt

      - name: Validate source and build mod
        run: |
          .venv/bin/python crowdin_sync.py check
          .venv/bin/python build_test_mod.py

      - name: Package mod
        run: |
          mkdir -p dist
          tar -C "$HOME/.local/share/Steam/steamapps/common/Space Rangers HD A War Apart/Mods/Tweaks" \
            -czf "dist/BelTranslate-${GITHUB_REF_NAME}.tar.gz" BelTranslate

      - uses: actions/upload-artifact@v7
        with:
          name: BelTranslate-${{ github.ref_name }}
          path: dist/*.tar.gz

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release patcher

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pack player zip
        run: python3 pack_release.py

      - uses: actions/upload-artifact@v4
        with:
          name: beltranslate-patcher
          path: dist/beltranslate-patcher-*.zip
          if-no-files-found: error

      - name: Attach zip to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/beltranslate-patcher-*.zip --clobber
